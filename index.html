  }

    return e('div', null,

  function hitungGrafikPemasukan(transaksi) {
    var pemasukan = transaksi.filter(function (t) { return t.tipe === 'pemasukan'; });
    var byDate = {};
    pemasukan.forEach(function (t) { byDate[t.tanggal] = (byDate[t.tanggal] || 0) + t.nominal; });
    var dates = Object.keys(byDate).sort();
    var cum = 0;
    return dates.map(function (d) {
      cum += byDate[d];
      return { tanggal: d, harian: byDate[d], kumulatif: cum };
    });
  }

  function hitungGrafikPengeluaran(transaksi) {
    var pengeluaran = transaksi.filter(function (t) { return t.tipe === 'pengeluaran'; });
    var byDate = {};
    pengeluaran.forEach(function (t) { byDate[t.tanggal] = (byDate[t.tanggal] || 0) + t.nominal; });
    var dates = Object.keys(byDate).sort();
    var cum = 0;
    return dates.map(function (d) {
      cum += byDate[d];
      return { tanggal: d, harian: byDate[d], kumulatif: cum };
    });
  }

  function hitungGrafikNetHarian(transaksi) {
    var byDate = {};
    transaksi.forEach(function (t) {
      if (t.tipe === 'pemasukan') byDate[t.tanggal] = (byDate[t.tanggal] || 0) + t.nominal;
      else if (t.tipe === 'pengeluaran') byDate[t.tanggal] = (byDate[t.tanggal] || 0) - t.nominal;
    });
    var dates = Object.keys(byDate).sort();
    var cum = 0;
    return dates.map(function (d) {
      cum += byDate[d];
      return { tanggal: d, net: byDate[d], kumulatif: cum };
    });
  }

  function IncomeChart(props) {

    if (points.length === 0) {

    }
    var W = 300, H = 110, padL = 4, padR = 4, padT = 10, padB = 4;
    var maxY = Math.max.apply(null, points.map(function (p) { return p.kumulatif; })) || 1;
    var n = points.length;
    var xStep = n > 1 ? (W - padL - padR) / (n - 1) : 0;
    function xAt(i) { return n > 1 ? padL + i * xStep : W / 2; }
    function yAt(v) { return H - padB - (v / maxY) * (H - padT - padB); }
    var pathStr = points.map(function (p, i) { return (i === 0 ? 'M' : 'L') + xAt(i).toFixed(1) + ',' + yAt(p.kumulatif).toFixed(1); }).join(' ');
    var circles = points.map(function (p, i) {

        style: { cursor: 'pointer' }, onClick: function () { onSelect(p.tanggal); }
      });
    });
    return e('div', null,

      ),

        e('span', null, points[0].tanggal),
        e('span', null, points[n - 1].tanggal)

  }

  function NetChart(props) {
    var points = props.points;
    var selectedDate = props.selectedDate;
    var onSelect = props.onSelect;
    var HIJAU = '#7fb37a', MERAH = '#d2766c';
    if (points.length === 0) {
      return e('div', { style: { fontSize: 13, color: '#5f6a78' } }, 'Belum ada data buat ditampilin di grafik.');
    }
    var W = 300, H = 130, padL = 4, padR = 4, padT = 12, padB = 14;
    var n = points.length;
    var baseline = H - padB - (H - padT - padB) * 0.35;
    var maxAbsNet = Math.max.apply(null, points.map(function (p) { return Math.abs(p.net); })) || 1;
    var barBudget = (H - padT - padB) * 0.32;
    var kumVals = points.map(function (p) { return p.kumulatif; });
    var minKum = Math.min.apply(null, kumVals.concat([0]));
    var maxKum = Math.max.apply(null, kumVals.concat([0]));
    var rangeKum = (maxKum - minKum) || 1;
    var lineTop = padT, lineBottom = baseline - 6;
    function yKum(v) { return lineBottom - ((v - minKum) / rangeKum) * (lineBottom - lineTop); }
    var xStep = n > 1 ? (W - padL - padR) / (n - 1) : 0;
    function xAt(i) { return n > 1 ? padL + i * xStep : W / 2; }
    var barW = Math.max(2, Math.min(10, xStep * 0.5));

    var bars = points.map(function (p, i) {
      var h = (Math.abs(p.net) / maxAbsNet) * barBudget;
      var isNeg = p.net < 0;
      var y = isNeg ? baseline : baseline - h;
      return e('rect', { key: 'bar' + p.tanggal, x: xAt(i) - barW / 2, y: y, width: barW, height: Math.max(1, h), fill: isNeg ? MERAH : HIJAU, opacity: 0.55 });
    });

    var segments = [];
    for (var i = 1; i < n; i++) {
      var naik = points[i].kumulatif >= points[i - 1].kumulatif;
      segments.push(e('line', {
        key: 'seg' + i, x1: xAt(i - 1), y1: yKum(points[i - 1].kumulatif), x2: xAt(i), y2: yKum(points[i].kumulatif),
        stroke: naik ? HIJAU : MERAH, strokeWidth: 1.8
      }));
    }
    var circles = points.map(function (p, i) {
      var isSel = selectedDate === p.tanggal;
