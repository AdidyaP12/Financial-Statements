  function pad2(n) { return (n < 10 ? '0' : '') + n; }

                e('div', { className: 'row' }, e('span', null, 'Nominal diterima bersih'), e('span', { className: 'num' }, fmt(u.nominalDiterima))),
                e('div', { className: 'row' }, e('span', null, 'Cicilan / bulan'), e('span', { className: 'num' }, fmt(u.cicilanPerBulan) + ' \u00d7 ' + u.totalCicilan)),
                e('div', { className: 'row' }, e('span', null, 'Bunga cicilan'), e('span', { className: 'num', style: { color: '#d2766c' } }, fmt(u.bunga))),
                e('div', { className: 'row' }, e('span', null, 'Total biaya riil'), e('span', { className: 'num', style: { color: '#d2766c' } }, fmt(u.totalBiayaRiil) + ' (' + u.persenBiaya.toFixed(1) + '%)')),
                e('div', { className: 'row' }, e('span', null, 'Sisa tagihan'), e('span', { className: 'num', style: { fontWeight: 700 } }, fmt(u.sisaTagihan)))
              )
            );
          })
        )
      );
    } else if (tab === 'neraca') {
      content = e('div', null,
        e('button', { style: Object.assign({}, btnPrimary, { marginBottom: 16 }), onClick: function () { setModal('harta'); } }, '+ Tambah Harta'),
        e('div', { className: 'card' },
          data.harta.length === 0 ? e('div', { style: { fontSize: 13, color: '#5f6a78' } }, 'Belum ada harta tercatat.') : null,
          data.harta.map(function (h) {
            var delta = h.nilaiSekarang - h.hargaBeli;
            var st = hitungStatusHarta(h, data.transaksi);
            return e('div', { className: 'row', key: h.id, style: { alignItems: 'flex-start' } },
              e('div', null,
                e('div', { style: { fontSize: 14 } },
                  h.nama,
                  h.tag === 'non-jual' ? e('span', { style: { fontSize: 10, color: '#c9a15a', marginLeft: 6, border: '1px solid #4a4022', borderRadius: 4, padding: '1px 5px' } }, 'NON-JUAL') : null,
                  st.berlaku ? e('span', { style: { fontSize: 10, marginLeft: 6, border: '1px solid ' + (st.status === 'Aset' ? '#2e4a2e' : '#4a3a22'), color: st.status === 'Aset' ? '#a9c9a3' : '#c9a15a', borderRadius: 4, padding: '1px 5px' } }, st.status === 'Aset' ? 'ASET \u00b7 ada income 30 hari' : 'NETRAL \u00b7 gak ada income 30 hari') : null
                ),
                e('div', { style: { fontSize: 11, color: '#5f6a78' } }, 'Beli ' + fmt(h.hargaBeli) + ' \u00b7 ' + (delta >= 0 ? '+' : '') + fmt(delta) + (st.berlaku && st.tanggalTerakhirIncome ? ' \u00b7 income terakhir ' + st.tanggalTerakhirIncome : ''))
              ),
              e('div', { style: { display: 'flex', alignItems: 'center', gap: 4 } },
                e('span', { className: 'num', style: { fontSize: 14 } }, fmt(h.nilaiSekarang)),
                e(DeleteBtn, { onClick: function () { delHarta(h.id); } })
              )
            );
          })
        )
      );
    }

    var modalEl = null;
    if (modal === 'transaksi') modalEl = e(Modal, { title: 'Transaksi Baru', onClose: function () { setModal(null); } }, e(TransaksiForm, { wallets: data.wallets, onSave: function (t) { addTransaksi(t); setModal(null); } }));
    if (modal === 'wallet') modalEl = e(Modal, { title: 'Wallet Baru', onClose: function () { setModal(null); } }, e(WalletForm, { onSave: function (w) { addWallet(w); setModal(null); } }));
    if (modal === 'harta') modalEl = e(Modal, { title: 'Harta Baru', onClose: function () { setModal(null); } }, e(HartaForm, { onSave: function (h) { addHarta(h); setModal(null); } }));
    if (modal === 'utang') modalEl = e(Modal, { title: 'Utang/Tagihan Baru', onClose: function () { setModal(null); } }, e(UtangForm, { onSave: function (u) { addUtang(u); setModal(null); } }));

    return e('div', { style: { minHeight: '100vh' } },
      e('div', { style: { maxWidth: 720, margin: '0 auto', padding: '20px 16px 60px' } },
        e('div', { style: { display: 'flex', alignItems: 'center', gap: 9, marginBottom: 4 } },
          e(Logo, null),
          e('h1', { style: { fontSize: 21, margin: 0, color: '#f2ede3' } }, 'Financial-Statements'),
          e('span', { style: { fontSize: 11, color: '#5f6a78', marginLeft: 'auto' } }, 'v0.3')
        ),
        e('p', { style: { color: '#7d8794', fontSize: 13, marginTop: 2, marginBottom: 20 } }, 'Keuangan pribadi \u2014 catat sendiri, mulai dari nol'),
        tabButtons,
        content
      ),
      modalEl
    );
  }

  var root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(e(App));

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function (err) {
        console.log('Service worker gagal daftar:', err);
      });
    });
  }
})();
</script>
</body>
</html>
